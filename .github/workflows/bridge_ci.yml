name: Headless Bridge CI Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-bridge:
    name: Validate Real-Time Telemetry & Control Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Start Static File Server
        run: |
          python -m http.server 8000 &
          sleep 2

      - name: Run Automated Headless Bridge Verification
        run: |
          python bridge.py --url http://localhost:8000/index.html --headless --mode test
