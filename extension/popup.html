<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 4px 0;
      font-size: 12px;
      color: #94a3b8;
    }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: #1e293b;
      color: #38bdf8;
      margin-top: 8px;
    }
    .endpoint {
      margin-top: 10px;
      padding: 8px;
      background: #1e293b;
      border-radius: 6px;
      font-family: monospace;
      font-size: 11px;
      color: #e2e8f0;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h3>Proxie Robot Bridge</h3>
  <p>Manifest V3 telemetry bridge between hosted Three.js and local Python IDE.</p>
  <div class="badge">WebSocket Bridge</div>
  <div class="endpoint">Target: ws://localhost:8765</div>
  <p style="margin-top: 10px; font-size: 11px; color: #64748b;">
    Ensure <code>bridge_ws.py</code> or <code>bridge.py</code> is running locally.
  </p>
</body>
</html>
